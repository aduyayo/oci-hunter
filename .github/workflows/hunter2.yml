name: OCI Cloud Hunter Batam B (Paralel)

on:
  schedule:
    - cron: '*/30 * * * *'  # Cadangan cron setiap 30 menit
  workflow_dispatch:

# Concurrency group BERBEDA dari hunter utama agar bisa jalan paralel
concurrency:
  group: oci-hunter-b
  cancel-in-progress: false

jobs:
  hunt:
    name: OCI Auto-Hunter B (FD Reversed)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OCI Auto-Hunter B (Reversed FD Order)
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          OCI_BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_AD: ${{ secrets.OCI_AD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_RUN_MINUTES: 330
        run: |
          python oracle_hunter2.py

      - name: Auto-Trigger Next Session B (Zero Downtime)
        if: success()
        env:
          PAT: ${{ secrets.AUTO_TRIGGER_PAT }}
        run: |
          FLAG_FILE="${RUNNER_TEMP:-/tmp}/hunter_continue"
          if [ -f "$FLAG_FILE" ] && [ -n "$PAT" ]; then
            echo "[*] Sesi B selesai, belum dapat slot. Melanjutkan Hunter B sesi berikutnya..."
            curl -s -X POST \
              -H "Authorization: token $PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/hunter2.yml/dispatches \
              -d '{"ref":"main"}' || true
          else
            echo "[*] Server sudah aktif atau tidak ada kelanjutan yang diperlukan."
          fi
