name: OCI Cloud Hunter Batam

on:
  schedule:
    - cron: '*/30 * * * *'  # Trigger otomatis cadangan
  workflow_dispatch:       # Tombol manual kapan saja
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

# Pastikan hanya 1 hunter yang menembak dalam satu waktu, yang baru otomatis antre & langsung nyambung
concurrency:
  group: oci-hunter
  cancel-in-progress: false

jobs:
  hunt:
    name: OCI Auto-Hunter
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Batas aman GitHub Actions

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OCI Auto-Hunter
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          OCI_BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_AD: ${{ secrets.OCI_AD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_RUN_MINUTES: 330
        run: |
          python oracle_hunter.py

      - name: Auto-Trigger Next Session (Zero Downtime)
        if: success()
        env:
          PAT: ${{ secrets.AUTO_TRIGGER_PAT }}
        run: |
          FLAG_FILE="${RUNNER_TEMP:-/tmp}/hunter_continue"
          if [ -f "$FLAG_FILE" ] && [ -n "$PAT" ]; then
            echo "[*] Sesi selesai dan server belum didapat. Memulai sesi berikutnya seketika (0 detik jeda)..."
            curl -s -X POST \
              -H "Authorization: token $PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/hunter.yml/dispatches \
              -d '{"ref":"main"}' || true
          else
            echo "[*] Server sudah aktif atau tidak ada kelanjutan yang diperlukan."
          fi
